server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hops are sent as traceroute finds them, so the response must not be buffered
  # or compressed on its way to the browser.
  location = /api/trace/stream {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
