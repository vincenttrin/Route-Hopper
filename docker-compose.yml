services:
  backend:
    build: ./backend
    environment:
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
      # The backend downloads the GeoIP databases on first start and refreshes them monthly.
      # Set a free MaxMind key to use GeoLite2 instead of the keyless DB-IP Lite default.
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-true}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
    volumes:
      # A named volume keeps the databases across restarts. GEOIP_DIR=./geoip uses a host
      # folder instead (it must be writable by uid 10001). See backend/README.md.
      - ${GEOIP_DIR:-geoip}:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  geoip:
